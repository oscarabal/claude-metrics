apiVersion: 1
# Removes a Prometheus datasource created before it had a fixed uid, so the provisioned one can take its place
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  # The improvement report of session-map, read by the «Mejoras» panels with the dashboard's time range and projects
  - name: Coach
    uid: coach
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      allowedHosts:
        - http://session-map:9100
